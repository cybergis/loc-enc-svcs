[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "effects-explainable-embeddings"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "torchspatial @ git+https://github.com/danielkiv/TorchSpatial.git",
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "torch>=1.10",
    "scikit-learn>=1.0",
    "xgboost>=1.6",
    "matplotlib>=3.5",
    "geopandas>=0.10",
    "libpysal>=4.6",
    "esda>=2.4",
    "flaml>=1.0",
    "geoshapley @ git+https://github.com/ziqi-li/geoshapley.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = []